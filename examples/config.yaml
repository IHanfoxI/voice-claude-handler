    - terminal
    - consola
    - codigo
    - editor
    - mira
    - miro
    - miras
    - miramos
    - miran
    - mirando
    - mirar
    - fijate
    - fijar
    - fija
    - fijese
    - ves
    - veo
    - vemos
    - veas
    - ver
    - viendo
