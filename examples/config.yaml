# voice-claude-handler — configuración modular
# Copia a ~/.local/share/voice-claude/config.yaml y edita a gusto.
# Solo necesitas incluir las secciones que quieres sobreescribir;
# el resto usa los valores por defecto embebidos en kokoro/config.py.
#
# Requiere: pyyaml  (pip install pyyaml  o  pacman -S python-yaml)
# Env vars VOICE_CLAUDE_* siguen teniendo prioridad sobre este archivo.

tts:
  # Voz Kokoro. Puede ser una sola (ej. "ef_dora") o blend con "+" (ej. "ef_dora+af_bella").
  voice: "ef_dora+af_bella"

  # Velocidad de síntesis. 1.0 = normal, 1.3 = más rápido para TTS de voz.
  speed: 1.3

  # Idioma para Kokoro. "es" para español.
  lang: "es"

  # Sink de PulseAudio/PipeWire para reproducir el TTS.
  # Vacío = sink por defecto del sistema.
  # Lista sinks disponibles: pactl list short sinks
  sink: ""

  # Timeout de respuesta del daemon Kokoro (segundos).
  daemon_timeout: 30

# Modelos por modo. quick = Alt+Z, full = Super+Z.
models:
  quick:
    model: "haiku"
    effort: "low"
  full:
    model: "opus"
    effort: "high"

# Palabras y frases que activan la captura de pantalla antes de llamar a Claude.
# Si la transcripción contiene alguna, se hace screenshot y se incluye en el prompt.
# Modifica/amplía esta lista para ajustar los falsos positivos/negativos.
