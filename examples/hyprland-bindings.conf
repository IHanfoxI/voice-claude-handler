# Snippet para ~/.config/hypr/hyprland.conf (sintaxis clásica).
# Si usas la configuración lua de Omarchy, ver hyprland-bindings.lua.

# Voice → Claude (quick): Alt+Z. Haiku + Read only.
bind = ALT, Z, exec, sh -c 'echo quick > $HOME/.local/share/voice-claude/mode; handy --toggle-transcription'

# Voice → Claude (full): Super+Z. Opus + TODAS las tools + permisos saltados.
# ATENCIÓN: puede ejecutar Bash, Edit, Write, WebFetch, etc. sin confirmar.
bind = SUPER, Z, exec, sh -c 'echo full > $HOME/.local/share/voice-claude/mode; handy --toggle-transcription'

# Window rules: que la ventana de Handy no robe foco al juego/app activa.
windowrulev2 = noinitialfocus, class:^(handy)$
windowrulev2 = nofocus, class:^(handy)$
