# Snippet para ~/.config/hypr/hyprland.conf (sintaxis clásica).
# Si usas la configuración lua de Omarchy, ver hyprland-bindings.lua.

# Autostart del overlay de estado (punto coloreado arriba-derecha).
exec-once = $HOME/.local/bin/voice-claude-overlay

# Voice → Claude (quick): Alt+Z. Haiku + Read only.
# Antes de Handy: escribe "listening" al state file (overlay verde).
bind = ALT, Z, exec, sh -c 'echo listening > $HOME/.local/share/voice-claude/state; echo quick > $HOME/.local/share/voice-claude/mode; handy --toggle-transcription'

# Voice → Claude (full): Super+Z. Opus + whitelist explícita de Bash/tools.
# Puede controlar el sistema (hyprctl, pactl, playerctl, omarchy*, steam,
# uwsm-app, etc.) y editar archivos, pero NO ejecuta rm, sudo, chmod ni dd.
bind = SUPER, Z, exec, sh -c 'echo listening > $HOME/.local/share/voice-claude/state; echo full > $HOME/.local/share/voice-claude/mode; handy --toggle-transcription'

# Cancelar respuesta en curso (mata TTS + claude + stream_tts, resetea overlay).
bind = ALT SHIFT, Z, exec, $HOME/.local/bin/voice-claude-cancel.sh

# Window rules: que la ventana de Handy no robe foco al juego/app activa.
windowrulev2 = noinitialfocus, class:^(handy)$
windowrulev2 = nofocus, class:^(handy)$
